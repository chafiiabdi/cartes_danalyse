<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accessibilité PMR – Anglet</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css"><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#142235}#map{height:100vh;width:100%}.panel{position:absolute;z-index:2;top:16px;left:16px;background:#fff;padding:18px;border-radius:12px;box-shadow:0 4px 20px #0002;max-width:320px}.panel h1{font-size:19px;margin:0 0 6px}.panel p{font-size:12px;color:#526071;line-height:1.5}.layer{display:flex;align-items:center;gap:9px;margin:12px 0;font-size:14px}.swatch{width:16px;height:7px;border-radius:3px;display:inline-block}.status{font-size:12px;color:#526071}.popup{position:absolute;background:white;padding:12px;border-radius:9px;box-shadow:0 2px 14px #0003;min-width:180px;max-width:280px;font-size:13px}.popup:empty{display:none}button{cursor:pointer;border:1px solid #ddd;background:#f7f7f7;border-radius:6px;padding:6px 10px}#fit{margin-top:10px}@media(max-width:550px){.panel{top:8px;left:8px;right:8px;max-width:none;padding:12px}.panel h1{font-size:16px}.layer{display:inline-flex;margin:6px 8px 6px 0}#map{height:100dvh}}
</style></head><body><div id="map"></div><div class="panel"><h1>Accessibilité PMR – Anglet</h1><p>Cheminements accessibles sans escaliers, à partir des arrêts et quais PMR. Durées calculées sur le réseau.</p><div id="layers"></div><button id="fit">Zoom sur les résultats</button><p id="status" class="status">Chargement des couches…</p></div><div id="popup" class="popup"></div><script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script><script>
const configs=[{file:'data/iso_300s.geojson',label:'5 min (300 s)',color:'#16a34a',width:5},{file:'data/iso_600s.geojson',label:'10 min (600 s)',color:'#f59e0b',width:4},{file:'data/iso_900s.geojson',label:'15 min (900 s)',color:'#dc2626',width:3}];
const format=new ol.format.GeoJSON();const map=new ol.Map({target:'map',layers:[new ol.layer.Tile({source:new ol.source.OSM()})],view:new ol.View({center:ol.proj.fromLonLat([-1.52,43.49]),zoom:12})});const layers=[];const status=document.getElementById('status');let loaded=0;let errors=[];
const popup=document.getElementById('popup');const overlay=new ol.Overlay({element:popup,autoPan:{animation:{duration:200}}});map.addOverlay(overlay);
function zoomToData(){const extent=ol.extent.createEmpty();layers.forEach(l=>{if(l.getVisible()&&l.getSource().getFeatures().length)ol.extent.extend(extent,l.getSource().getExtent())});if(!ol.extent.isEmpty(extent))map.getView().fit(extent,{padding:[70,70,70,70],maxZoom:17,duration:450})}
configs.forEach((cfg,i)=>{const source=new ol.source.Vector();const layer=new ol.layer.Vector({source,style:new ol.style.Style({stroke:new ol.style.Stroke({color:cfg.color,width:cfg.width}),image:new ol.style.Circle({radius:5,fill:new ol.style.Fill({color:cfg.color})})})});layer.set('label',cfg.label);map.addLayer(layer);layers.push(layer);const row=document.createElement('label');row.className='layer';const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.addEventListener('change',()=>{layer.setVisible(cb.checked);zoomToData()});const sw=document.createElement('span');sw.className='swatch';sw.style.background=cfg.color;row.append(cb,sw,document.createTextNode(cfg.label));document.getElementById('layers').append(row);
fetch(cfg.file).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(json=>{const features=format.readFeatures(json,{dataProjection:'EPSG:4326',featureProjection:'EPSG:3857'});source.addFeatures(features);loaded++;status.textContent=`${loaded}/3 couches chargées`+(errors.length?' — Erreurs : '+errors.join(', '):'');zoomToData()}).catch(e=>{errors.push(cfg.file+' ('+e.message+')');status.textContent='Vérifie les fichiers GeoJSON : '+errors.join(', ')})});
map.on('singleclick',e=>{let found=false;map.forEachFeatureAtPixel(e.pixel,(feature,layer)=>{if(found)return;found=true;const props=feature.getProperties();const title=document.createElement('strong');title.textContent=layer?.get('label')||'Tronçon';popup.replaceChildren(title,document.createElement('hr'));Object.entries(props).filter(([k,v])=>k!=='geometry'&&v!==null&&typeof v!=='object').slice(0,12).forEach(([k,v])=>{const div=document.createElement('div');div.textContent=k+' : '+String(v);popup.append(div)});overlay.setPosition(e.coordinate);return true});if(!found){overlay.setPosition(undefined);popup.replaceChildren()}});document.getElementById('fit').addEventListener('click',zoomToData);
</script></body></html>
