<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accessibilité PMR — Anglet</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
  <style>
    html,body{margin:0;height:100%;font-family:Arial,sans-serif;color:#243044}
    #map{height:100vh;width:100%}
    .panel{position:absolute;top:16px;left:16px;z-index:10;background:#fff;padding:18px;border-radius:12px;box-shadow:0 3px 18px #0003;max-width:300px}
    h1{font-size:18px;margin:0 0 8px}p{font-size:13px;color:#5d6674;line-height:1.5}
    .layer{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:14px;cursor:pointer}
    .swatch{display:inline-block;width:14px;height:14px;border-radius:3px}
    button{background:#175f9f;color:white;border:0;border-radius:7px;padding:9px 12px;cursor:pointer}
    #status{font-size:12px;color:#555;margin-top:12px;max-height:110px;overflow:auto}
    .popup{background:white;border-radius:8px;box-shadow:0 2px 14px #0004;padding:12px;min-width:210px;max-width:320px;max-height:250px;overflow:auto;font-size:12px}
    .popup h2{font-size:14px;margin:0 0 8px}.popup table{border-collapse:collapse;width:100%;word-break:break-word}.popup td{padding:5px;border-bottom:1px solid #eee;vertical-align:top}
    .popup td:first-child{font-weight:bold}.close{float:right;cursor:pointer;background:none;color:#333;font-size:18px;padding:0 4px}
    @media(max-width:600px){.panel{top:8px;left:8px;right:8px;max-width:none;padding:12px}.layer{margin:7px 0}}
  </style>
</head>
<body>
  <div id="map" aria-label="Carte interactive des cheminements PMR à Anglet"></div>
  <aside class="panel">
    <h1>Accessibilité PMR — Anglet</h1>
    <p>Cheminements accessibles en fauteuil roulant électrique, sans escaliers.</p>
    <label class="layer"><input type="checkbox" data-layer="300" checked><span class="swatch" style="background:#1b9e77"></span> 300 s — 5 minutes</label>
    <label class="layer"><input type="checkbox" data-layer="600" checked><span class="swatch" style="background:#e6a23c"></span> 600 s — 10 minutes</label>
    <label class="layer"><input type="checkbox" data-layer="900" checked><span class="swatch" style="background:#d64a4a"></span> 900 s — 15 minutes</label>
    <label class="layer"><input type="checkbox" data-layer="stops" checked><span class="swatch" style="background:#1666c0;border-radius:50%"></span> Arrêts et quais PMR</label>
    <button id="zoomData">Zoom sur les données</button>
    <div id="status" role="status">Chargement des couches…</div>
  </aside>
  <div id="popup" class="popup" style="display:none"><button id="closePopup" class="close" aria-label="Fermer">×</button><div id="popupContent"></div></div>
  <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>
  <script>
    // Les GeoJSON doivent être exportés en EPSG:4326 (WGS84).
    const specs = [
      {id:'900',file:'iso_900s.geojson',color:'#d64a4a',width:5},
      {id:'600',file:'iso_600s.geojson',color:'#e6a23c',width:4},
      {id:'300',file:'iso_300s.geojson',color:'#1b9e77',width:3},
      {id:'stops',file:'stops_quai_PMR.geojson',color:'#1666c0'}
    ];
    const status = document.getElementById('status');
    const messages = [];
    function report(message){messages.push(message);status.textContent=messages.join(' | ');}
    const layers = {};
    const vectorLayers = specs.map(spec => {
      const source = new ol.source.Vector({
        url:'./data/'+spec.file,
        format:new ol.format.GeoJSON({dataProjection:'EPSG:4326',featureProjection:'EPSG:3857'})
      });
      const layer = new ol.layer.Vector({
        source,
        style: function(feature){
          const type=feature.getGeometry()?.getType()||'';
          if(type.includes('Point')) return new ol.style.Style({image:new ol.style.Circle({radius:6,fill:new ol.style.Fill({color:spec.color}),stroke:new ol.style.Stroke({color:'#fff',width:2})})});
          if(type.includes('Polygon')) return new ol.style.Style({stroke:new ol.style.Stroke({color:spec.color,width:2}),fill:new ol.style.Fill({color:spec.color+'55'})});
          return new ol.style.Style({stroke:new ol.style.Stroke({color:spec.color,width:spec.width||3})});
        }
      });
      layers[spec.id]=layer;
      source.on('featuresloadend',()=>report(spec.file+' : '+source.getFeatures().length+' objets'));
      source.on('featuresloaderror',()=>report('ERREUR : '+spec.file+' (vérifier nom, chemin et GeoJSON)'));
      return layer;
    });
    const map = new ol.Map({
      target:'map',
      layers:[new ol.layer.Tile({source:new ol.source.OSM()}),...vectorLayers],
      view:new ol.View({center:ol.proj.fromLonLat([-1.52,43.49]),zoom:12})
    });
    function zoomToData(){
      const extent=ol.extent.createEmpty();
      for(const layer of vectorLayers){
        const source=layer.getSource();
        if(source.getFeatures().length)ol.extent.extend(extent,source.getExtent());
      }
      if(!ol.extent.isEmpty(extent))map.getView().fit(extent,{padding:[65,65,65,340],maxZoom:17,duration:450});
      else report('Aucune géométrie chargée pour le zoom');
    }
    document.getElementById('zoomData').addEventListener('click',zoomToData);
    document.querySelectorAll('[data-layer]').forEach(input=>{
      input.addEventListener('change',()=>layers[input.dataset.layer].setVisible(input.checked));
    });
    const popupElement=document.getElementById('popup');
    const overlay=new ol.Overlay({element:popupElement,autoPan:{animation:{duration:200}},positioning:'bottom-center',offset:[0,-12]});
    map.addOverlay(overlay);
    function closePopup(){overlay.setPosition(undefined);popupElement.style.display='none';}
    document.getElementById('closePopup').addEventListener('click',closePopup);
    map.on('singleclick',event=>{
      let found=null;
      map.forEachFeatureAtPixel(event.pixel,(feature,layer)=>{if(layer instanceof ol.layer.Vector){found=feature;return true;}},{hitTolerance:6});
      if(!found){closePopup();return;}
      const props={...found.getProperties()};delete props.geometry;
      const content=document.getElementById('popupContent');
      content.replaceChildren();
      const title=document.createElement('h2');title.textContent='Informations de l’objet';content.append(title);
      const table=document.createElement('table');
      for(const [key,value] of Object.entries(props)){
        const tr=document.createElement('tr');
        const name=document.createElement('td');name.textContent=key;
        const val=document.createElement('td');val.textContent=typeof value==='object'?JSON.stringify(value):String(value??'');
        tr.append(name,val);table.append(tr);
      }
      if(!table.rows.length){const p=document.createElement('p');p.textContent='Aucun attribut';content.append(p);}else content.append(table);
      popupElement.style.display='block';overlay.setPosition(event.coordinate);
    });
    map.on('pointermove',event=>{map.getTargetElement().style.cursor=map.hasFeatureAtPixel(event.pixel)?'pointer':'';});
  </script>
</body>
</html>
